name: WhyAmIHere
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  WAIHCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  WhyAmIHere:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: WAIHCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Why Am I Here?"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - whyamihere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WAIH_BUNDLE_ID)
        PRODUCT_NAME: WhyAmIHere
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  WhyAmIHereUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: WhyAmIHere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WAIH_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WhyAmIHere
schemes:
  WhyAmIHere:
    build:
      targets:
        WhyAmIHere: all
        WhyAmIHereUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WhyAmIHereUITests
    archive:
      config: Release
